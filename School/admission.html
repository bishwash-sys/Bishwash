<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>School Admission Form</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .form-container { max-width: 500px; background: white; padding: 30px; margin: auto; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .submit-btn { background: #2ecc71; color: white; border: none; cursor: pointer; font-size: 18px; }
        .submit-btn:hover { background: #27ae60; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Student Admission Form</h2>
    <form action="process_admission.php" method="POST">
        <label>Full Name:</label>
        <input type="text" name="student_name" required>

        <label>Email Address:</label>
        <input type="email" name="email" required>

        <label>Phone Number:</label>
        <input type="text" name="phone" required>

        <label>Applying for Grade:</label>
        <select name="grade">
            <option value="11">Grade 11</option>
            <option value="12">Grade 12</option>
        </select>

        <button type="submit" name="submit" class="submit-btn">Submit Application</button>
    </form>
</div>

</body>
</html>
